events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Global Rate Limiting Zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Connection Limiting Zone: Max 20 connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend_api {
        # Docker DNS automatically load balances across scaled container instances of 'backend'
        server backend:80;
        keepalive 32;
    }

    upstream ml_api {
        server ml_service:8000;
        keepalive 16;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Apply Connection Limit Globally
        limit_conn conn_limit 20;

        # Frontend SPA Static Assets
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Browser Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
                proxy_pass http://frontend_app;
                expires 7d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # Load-balanced & Rate-limited REST API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Apply Rate Limiting: Burst of 5 requests allowed
            limit_req zone=api_limit burst=5 nodelay;
        }

        # Real-time SignalR Hub (Bypasses rate limiting to prevent disconnects)
        location /hub/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # Machine Learning Predictions
        location /ml/ {
            proxy_pass http://ml_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
