name: ChargeWise AI - Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Step 1: Setup .NET 8 for ASP.NET Backend
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/ChargeWise.API/ChargeWise.API.csproj

    - name: Build ASP.NET Core API
      run: dotnet build backend/ChargeWise.API/ChargeWise.API.csproj --no-restore --configuration Release

    # Step 2: Setup Python for ML Microservice
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ML Dependencies & Test Models
      run: |
        python -m pip install --upgrade pip
        pip install -r ml_service/requirements.txt
        python -m ml_service.training.train_models

    # Step 3: Setup Node.js for Frontend
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend & Build
      run: |
        cd frontend
        npm install
        npm run build

    # Step 4: Validate Docker Build
    - name: Build Docker Stack
      run: docker compose build
